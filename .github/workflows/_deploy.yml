name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      env_prefix:
        required: true
        type: string       # "Dev" or "Production" — used only for job summary label
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      HOST:
        required: true     # Server IP — used for SSH and to build VITE_API_URL
      DATABASE_URL:
        required: true
      GH_TOKEN:
        required: true
      MCP_SHARED_SECRET:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Cancel any in-progress deploy for the same branch so two pushes in quick
    # succession never race against the same server or run migrations concurrently.
    concurrency:
      group: deploy-${{ inputs.branch }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://${{ secrets.HOST }}.nip.io/api
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Prepare server directories
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 ubuntu@${{ secrets.HOST }} \
            "sudo mkdir -p /opt/occumax/frontend/dist && sudo chown -R ubuntu:ubuntu /opt/occumax"

      - name: Copy frontend build to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15" \
            frontend/dist/ \
            ubuntu@${{ secrets.HOST }}:/opt/occumax/frontend/dist/

      - name: Deploy backend & restart
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MCP_SHARED_SECRET: ${{ secrets.MCP_SHARED_SECRET }}
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_BRANCH: ${{ inputs.branch }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 ubuntu@${{ secrets.HOST }} \
            GH_TOKEN="$GH_TOKEN" \
            DATABASE_URL="$DATABASE_URL" \
            MCP_SHARED_SECRET="$MCP_SHARED_SECRET" \
            DEPLOY_HOST="$DEPLOY_HOST" \
            DEPLOY_BRANCH="$DEPLOY_BRANCH" \
            bash << 'ENDSSH'
            set -e

            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/niteshsinwar/occumax.git"

            sudo mkdir -p /opt/occumax
            sudo chown ubuntu:ubuntu /opt/occumax

            if [ ! -d "/opt/occumax/.git" ]; then
              git -C /opt/occumax init
              git -C /opt/occumax remote add origin "$REPO_URL"
            fi

            cd /opt/occumax
            git remote set-url origin "$REPO_URL"
            git fetch origin
            git checkout "$DEPLOY_BRANCH"
            git reset --hard "origin/${DEPLOY_BRANCH}"

            # Build .env from repo config + injected secrets
            cat /opt/occumax/backend/.env.server > /opt/occumax/.env
            echo "DATABASE_URL=${DATABASE_URL}" >> /opt/occumax/.env
            echo "CORS_ORIGINS=https://${DEPLOY_HOST}.nip.io" >> /opt/occumax/.env

            # Recreate venv if missing (can happen after server resets)
            if [ ! -f "/opt/occumax/venv/bin/pip" ]; then
              python3 -m venv /opt/occumax/venv
            fi

            /opt/occumax/venv/bin/pip install -r /opt/occumax/backend/requirements.txt -q

            # Three-state DB detection before running migrations:
            #   tracked    - alembic_version row present  -> upgrade head (normal path)
            #   has_tables - DB has objects, no tracking  -> stamp head then upgrade head
            #   empty_db   - completely empty DB          -> stamp base then upgrade head
            # The old two-state check (stamp base when rooms missing) was wrong for
            # has_tables: stamp base + upgrade head crashes on already-existing enums.
            cd /opt/occumax/backend
            DB_STATE=$(DATABASE_URL="${DATABASE_URL}" /opt/occumax/venv/bin/python3 -c "import os,psycopg2;url=os.environ['DATABASE_URL'].replace('postgresql+asyncpg://','postgresql://').replace('asyncpg://','postgresql://');conn=psycopg2.connect(url);cur=conn.cursor();cur.execute('SELECT EXISTS(SELECT 1 FROM information_schema.tables WHERE table_name=%s AND table_schema=%s)',('alembic_version','public'));has_alembic=cur.fetchone()[0];cur.execute('SELECT version_num FROM alembic_version LIMIT 1') if has_alembic else cur.execute('SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=%s AND table_type=%s',('public','BASE TABLE'));row=cur.fetchone();print('tracked' if (has_alembic and row) else ('empty_tracking' if has_alembic else ('has_tables' if row[0]>0 else 'empty_db')));conn.close()" 2>/dev/null || echo "empty_db")
            echo "DB state: ${DB_STATE}"
            if [ "$DB_STATE" = "empty_db" ]; then
              echo "Empty DB - stamping base and running all migrations from scratch"
              DATABASE_URL="${DATABASE_URL}" /opt/occumax/venv/bin/alembic stamp base 2>/dev/null || true
            elif [ "$DB_STATE" = "has_tables" ] || [ "$DB_STATE" = "empty_tracking" ]; then
              echo "DB has objects but no alembic tracking - stamping head to align"
              DATABASE_URL="${DATABASE_URL}" /opt/occumax/venv/bin/alembic stamp head 2>/dev/null || true
            fi
            DATABASE_URL="${DATABASE_URL}" /opt/occumax/venv/bin/alembic upgrade head

            sudo systemctl restart occumax-backend

            # Run the MCP server as a second local-only process on the same VM.
            # It intentionally uses its own venv because FastMCP can pull newer
            # ASGI dependencies than the main REST API pins.
            if [ ! -f "/opt/occumax/mcp-venv/bin/pip" ]; then
              python3 -m venv /opt/occumax/mcp-venv
            fi
            /opt/occumax/mcp-venv/bin/pip install -r /opt/occumax/backend/requirements.txt -q
            /opt/occumax/mcp-venv/bin/pip install -r /opt/occumax/backend/mcp_server/requirements-mcp.txt -q

            if [ -n "${MCP_SHARED_SECRET}" ]; then
              printf "%s" "${MCP_SHARED_SECRET}" > /opt/occumax/.mcp_shared_secret
            fi
            if [ ! -s "/opt/occumax/.mcp_shared_secret" ]; then
              openssl rand -hex 32 > /opt/occumax/.mcp_shared_secret
            fi
            chmod 600 /opt/occumax/.mcp_shared_secret
            MCP_SECRET_VALUE="$(cat /opt/occumax/.mcp_shared_secret)"
            {
              printf "MCP_SHARED_SECRET=%s\n" "${MCP_SECRET_VALUE}"
              printf "MCP_ALLOW_UNAUTHENTICATED=false\n"
            } > /opt/occumax/.env.mcp
            chmod 600 /opt/occumax/.env.mcp

            printf '%s\n' \
              '[Unit]' \
              'Description=Occumax MCP Server' \
              'After=network.target' \
              '' \
              '[Service]' \
              'User=ubuntu' \
              'WorkingDirectory=/opt/occumax/backend' \
              'EnvironmentFile=/opt/occumax/.env' \
              'EnvironmentFile=/opt/occumax/.env.mcp' \
              'ExecStart=/opt/occumax/mcp-venv/bin/uvicorn mcp_server.main:app --host 127.0.0.1 --port 8001' \
              'Restart=always' \
              'RestartSec=5' \
              '' \
              '[Install]' \
              'WantedBy=multi-user.target' \
              | sudo tee /etc/systemd/system/occumax-mcp.service > /dev/null
            sudo systemctl daemon-reload
            sudo systemctl enable occumax-mcp
            sudo systemctl restart occumax-mcp

            # Wait up to 30s for backend to be ready
            for i in $(seq 1 10); do
              sleep 3
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "Backend OK"
                break
              fi
              echo "Waiting for backend... attempt $i"
            done
            curl -sf http://localhost:8000/health || (echo "Backend failed to start" && sudo journalctl -u occumax-backend -n 20 --no-pager && exit 1)
            sudo systemctl is-active --quiet occumax-mcp || (echo "MCP failed to start" && sudo journalctl -u occumax-mcp -n 50 --no-pager && exit 1)
          ENDSSH

      - name: Configure Nginx timeouts
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 ubuntu@${{ secrets.HOST }} \
            "sudo tee /etc/nginx/conf.d/occumax-timeouts.conf > /dev/null << 'EOF'
          # AI endpoints (pricing/analyse, channel-recommend, ai/chat) can take
          # up to 300s per step; raise all proxy timeouts to 600s so Nginx never
          # kills a long-running AI request mid-stream with a 504.
          proxy_read_timeout    600s;
          proxy_connect_timeout  30s;
          proxy_send_timeout    600s;
          EOF
          sudo nginx -t"

      - name: Configure Nginx MCP route
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 ubuntu@${{ secrets.HOST }} \
            DEPLOY_HOST="$DEPLOY_HOST" \
            bash << 'ENDSSH'
            set -e

            sudo mkdir -p /etc/nginx/snippets
            printf '%s\n' \
              'location /mcp {' \
              '  proxy_pass http://127.0.0.1:8001/mcp;' \
              '  proxy_http_version 1.1;' \
              '  proxy_set_header Host $host;' \
              '  proxy_set_header X-Real-IP $remote_addr;' \
              '  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
              '  proxy_set_header X-Forwarded-Proto $scheme;' \
              '  proxy_set_header Authorization $http_authorization;' \
              '  proxy_buffering off;' \
              '  proxy_read_timeout 600s;' \
              '  proxy_send_timeout 600s;' \
              '}' \
              | sudo tee /etc/nginx/snippets/occumax-mcp-location.conf > /dev/null

            NGINX_SITE="$(sudo grep -RIl "server_name .*${DEPLOY_HOST}\.nip\.io" /etc/nginx/sites-enabled /etc/nginx/sites-available /etc/nginx/conf.d 2>/dev/null | head -n 1 || true)"
            if [ -z "${NGINX_SITE}" ]; then
              echo "Could not find nginx site config for ${DEPLOY_HOST}.nip.io"
              sudo nginx -T 2>/dev/null | grep -n "server_name" | head -20 || true
              exit 1
            fi

            sudo python3 -c 'import textwrap; exec(textwrap.dedent("""
            import sys
            from pathlib import Path

            path = Path(sys.argv[1])
            text = path.read_text()
            include = "    include /etc/nginx/snippets/occumax-mcp-location.conf;\\n"
            if include in text:
                raise SystemExit(0)

            markers = ("    location /api", "  location /api", "    location / ", "  location / ")
            for marker in markers:
                idx = text.find(marker)
                if idx != -1:
                    path.write_text(text[:idx] + include + text[idx:])
                    raise SystemExit(0)

            raise SystemExit(f"No suitable location block found in {path}")
            """))' "${NGINX_SITE}"

            sudo nginx -t
          ENDSSH

      - name: Reload Nginx
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 ubuntu@${{ secrets.HOST }} \
            "sudo systemctl reload nginx"

      - name: Health check — backend API
        run: |
          sleep 3
          # Hit /api/health, not / — Nginx serves the React SPA for /, which
          # passes even when the backend is down. /api/health proves the backend
          # is up and proxying correctly through Nginx.
          curl -f https://${{ secrets.HOST }}.nip.io/api/health || exit 1
          echo "${{ inputs.env_prefix }} deployment successful — https://${{ secrets.HOST }}.nip.io"

      - name: Health check — MCP route
        run: |
          sleep 3
          status=$(curl -k -sS -o /tmp/mcp-health.txt -w "%{http_code}" https://${{ secrets.HOST }}.nip.io/mcp || true)
          cat /tmp/mcp-health.txt || true
          case "$status" in
            401|405|406) echo "MCP route is reachable with expected unauthenticated/protocol response ($status)" ;;
            *) echo "Unexpected MCP route status: $status" && exit 1 ;;
          esac
